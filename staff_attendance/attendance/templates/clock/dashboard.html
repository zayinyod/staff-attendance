{% extends "frame.html" %}
{% load static %}
{% block title %}Dashboard{% endblock %}
{% block header %}<link rel="stylesheet" href="{% static 'css/form.css' %}">{% endblock %}
{% block body %}

<div class="main">
  <form method="GET">
    {% if has_invalid_date %}
      <div class="error"><p>Invalid date. Showing today's summary.</p></div>
    {% endif %}
    <h1>{{ date }}</h1>
    <p class="description">{{ summary }}</p>
  </form>
</div>

{% endblock %}
